<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>서브컬처 리서처</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="site.css">
</head>
<body class="public-site">
  <nav class="topnav">
    <span class="topnav-link active">서브컬처 리서처</span>
  </nav>
  <div class="layout">
    <aside class="sidebar">
      <h2>필터 &amp; 정렬</h2>
      <div class="stacked-form">
        <label>검색<input type="text" id="filter-q" placeholder="제목 · 작품 · 소스"></label>
        <div class="field-group"><label for="search-work">작품·IP 찾기</label><input type="search" id="search-work" placeholder="작품명 · 한글/영문/일문 별칭" aria-controls="filter-work"><p id="selected-work" role="status"></p><div id="filter-work" class="search-options"></div></div>

        <div class="field-group">
          <span class="field-label">카테고리</span>
          <div class="chip-row" id="filter-category"></div>
        </div>

        <div class="field-group">
          <span class="field-label">수집 기간</span>
          <div class="chip-row" id="filter-days">
            <a href="#" class="chip" data-value="7">최근 7일</a>
            <a href="#" class="chip" data-value="14">최근 14일</a>
            <a href="#" class="chip" data-value="30">최근 30일</a>
            <a href="#" class="chip" data-value="ALL">전체 기간</a>
          </div>
        </div>

        <div class="field-group">
          <span class="field-label">정렬</span>
          <div class="chip-row" id="filter-sort">
            <a href="#" class="chip" data-value="RECOMMENDED">추천순</a>
            <a href="#" class="chip" data-value="NEWEST">최신순</a>
            <a href="#" class="chip" data-value="OLDEST">오래된순</a>
          </div>
        </div>

        <div class="field-group"><label for="search-source">수집 출처 찾기</label><input type="search" id="search-source" placeholder="쇼핑몰 · 공식 사이트 이름" aria-controls="filter-source"><p id="selected-source" role="status"></p><div id="filter-source" class="search-options"></div></div>
      </div>
    </aside>

    <main>
      <section id="compare-panel" class="card draft-card" hidden aria-labelledby="compare-title">
        <div class="post-head">
          <h2 id="compare-title">비교글</h2>
          <button type="button" class="btn" id="compare-close">닫기</button>
        </div>
        <p id="compare-message" role="status"></p>
        <div class="draft-posts">
          <section class="post-block">
            <div class="post-head">
              <label for="post-body">① 본문 · 비교 정보</label>
              <span class="post-count" data-count-for="post-body"></span>
              <button type="button" class="btn btn-small" data-copy-target="post-body">복사</button>
              <button type="button" class="btn btn-small btn-primary" data-x-post-target="post-body">X에서 열기</button>
            </div>
            <textarea id="post-body" rows="8" autocomplete="off"></textarea>
          </section>
          <section class="post-block">
            <div class="post-head">
              <label for="post-reply">② 댓글 · 링크</label>
              <span class="post-count" data-count-for="post-reply"></span>
              <button type="button" class="btn btn-small" data-copy-target="post-reply">복사</button>
            </div>
            <textarea id="post-reply" rows="6" autocomplete="off"></textarea>
          </section>
        </div>
      </section>
      <h1>서브컬처 리서처</h1>
      <p class="subtitle" id="site-status">불러오는 중…</p>
      <div id="item-list" class="items"></div>
      <div id="more" class="load-more" hidden></div>
    </main>
  </div>
  <form id="compare-form" class="draft-bar" data-local="1" hidden>
    <span class="draft-bar-count">0개 선택</span>
    <button type="button" class="btn" id="compare-clear">선택 해제</button>
    <span id="compare-error" role="status"></span>
    <button type="submit" class="btn btn-primary">비교글 만들기</button>
  </form>
  <script src="app.js" defer></script>
  <script src="site.js" defer></script>
</body>
</html>
