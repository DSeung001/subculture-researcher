  # 다른 대형 페스티벌은 확인 결과 자동 수집기로 붙이기 어려웠다:
  # - Wonder Festival(wonfes.jp) 공지: robots.txt는 허용하지만 모든 공지가 /info/ 한 페이지 안의
  #   #info{id} 앵커로만 구분돼, URL 기준 중복 제거(SHA-256) 모델과 맞지 않는다.
  # - Comiket(comiket.co.jp): 정기 뉴스 목록 페이지가 없고 행사(C108/C109 등)마다 정적 페이지가
  #   개별 URL로 흩어져 있어 안정적인 link_selector를 잡기 어렵다.
  # - Anime Festival Asia(animefestival.asia): WordPress이지만 news-sitemap이 사실상 비어 있어
  #   (전용 뉴스/블로그 피드가 없음) 정기 수집 대상이 되지 못한다.
