sources:
  # 국내 피규어 예약 상품. 공개 목록과 상세 페이지에서 가격/예약마감/입고예정 메타데이터를 수집한다.
  - name: 피규어팜 예약상품
    type: figurefarm
    url: https://m.figurefarm.net/shop/big_section.php?cno1=1554
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    max_items: 50
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    figure_only: true
    enabled: true
    respect_robots: true
    detail_images_selector: '#ffDetailSection .img_wrapper img'  # 상세 본문(상단 공통 배너 .original_bnr 제외)

  # 일본 피규어/하비 뉴스. 카테고리 페이지에서 기사 링크만 수집한다.
  - name: HOBBY Watch 피규어
    type: html
    url: https://hobby.watch.impress.co.jp/category/figure/
    region: JP
    category: FIGURE
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://hobby\.watch\.impress\.co\.jp/docs/news/'
      - '^https://hobby\.watch\.impress\.co\.jp/docs/review/'
    max_items: 50
    enabled: true
    respect_robots: true
    list_image_selector: img  # li.item 안의 기사별 list.jpg

  # 일본 굿즈/피규어 미디어 허브. 본문 카드(.c-item)만 모아 사이드 랭킹을 제외한다.
  - name: Animate Times 굿즈
    type: html
    url: https://www.animatetimes.com/goods/
    link_selector: '.c-item a[href*="/news/details.php"]'
    region: JP
    category: GOODS
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://www\.animatetimes\.com/news/details\.php\?id=\d+'
    max_items: 50
    page_param: p  # 「もっと見る」= ?p=2… (페이지당 20건)
    max_pages: 3
    enabled: true
    respect_robots: true
    list_image_selector: img  # .c-item 카드의 기사별 이미지

  # 국내 애니/굿즈 뉴스. 목록이 JS로 그려져 브라우저 렌더링이 필요하다. robots.txt는 /api/만 막는다.
  # 좋아요 수 등 지표는 수집하지 않고 목록 카드의 기사 링크·제목·게시일·사진만 읽는다(상세는 열지 않음).
  - name: 애니플러스 뉴스
    type: html
    url: https://news.aniplustv.com/news
    render_js: true
    render_timeout_seconds: 30
    link_selector: '.grid a[href^="/news/"]:has(h3):has(p)'
    wait_selector: '.grid a[href^="/news/"]:has(h3):has(p)'
    title_selector: h3
    published_selector: p
    published_format: '%Y/%m/%d'
    next_page_selector: 'button[aria-label="다음 페이지"]'
    max_pages: 3
    region: KR
    category: ANIME
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://news\.aniplustv\.com/news/[0-9]+$'
    max_items: 50
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    list_image_selector: img  # 카드(a) 안의 기사별 이미지

  # ALTER 공식 상품 목록(발매월 최신순). 신작 공개 사진용으로 목록 카드(figure)만 읽는다.
  # robots.txt가 404(없음)라 허용으로 본다.
  - name: ALTER 상품
    type: html
    url: https://www.alter-web.jp/products/
    link_selector: 'figure a[href^="/products/"]'
    min_title_length: 1  # 「花火」처럼 짧은 일본어 상품명이 있어 기본(4자) 대신 1자
    region: JP
    category: FIGURE
    content_angle: NEWS
    source_tier: OFFICIAL
    allow_patterns:
      - '^https://www\.alter-web\.jp/products/\d+/?$'
    max_items: 30
    enabled: true
    respect_robots: true
    list_image_selector: img  # figure 안의 상품 대표 사진

  # 게임메카 모바일 게임 뉴스. 서브컬처 게임 이벤트·콜라보 소식용이며 MMO 기사도 섞여 첫 페이지만 소량 읽는다.
  # robots.txt의 Crawl-delay: 30을 지키도록 요청 간격을 30초 이상으로 둔다(목록 1페이지라 요청은 한 번).
  - name: 게임메카 모바일 게임 뉴스
    type: html
    url: https://www.gamemeca.com/news.php?ca=M
    link_selector: '.list_news .tit_thumb a[href*="view.php?gid="]'
    region: KR
    category: CHARACTER
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://www\.gamemeca\.com/view\.php\?gid=\d+$'
    max_items: 20
    request_delay_min_seconds: 30.0
    request_delay_max_seconds: 40.0
    enabled: true
    respect_robots: true
    list_image_selector: img  # li 카드의 썸네일

  # AGF(Anime Game Festival) Korea 공식 공지사항 = 국내 대표 서브컬처 페스티벌 소식.
  # 목록이 React 클라이언트 라우팅이라 HTML 링크 추출이 불가능해
  # 페이지가 실제로 호출하는 공개 JSON API(getBoardList)를 직접 불러온다. robots.txt 없음, CORS 공개.
  - name: AGF Korea 공지사항
    type: json_api
    url: https://api.agfkorea.com:3070/front/api/getBoardList?board_id=1&lang=KOR&gotoPage=1
    items_path: listData
    id_field: idx
    title_field: title
    date_field: writeday
    date_format: '%Y-%m-%d %H:%M:%S.%f'
    detail_url_template: 'https://www.agfkorea.com/post/1/{id}'
    image_html_field: content  # 공지 본문 HTML의 첫 <img>(안내 이미지)
    region: KR
    category: FESTIVAL
    content_angle: NEWS
    source_tier: OFFICIAL
    max_items: 50
    page_param: gotoPage  # 페이지당 10건, 응답의 pageCount까지
    page_count_field: pageCount
    max_pages: 4
    enabled: true

  # 수동 전용은 아래 local_only(네이버 스토어) 소스. 라프텔은 store.laftel.net 공개 HTML만
  # 자동 수집한다(아래 「라프텔 스토어」). laftel.net 인기·신작 브라우저 수집은 쓰지 않는다.

  # 국내 리셀러의 호요버스(원신/스타레일/젠레스존제로) 공식 라이선스 굿즈. 예약마감/가격이 목록에 노출된다.
  - name: 따빼몰 호요버스 굿즈
    type: html
    url: https://ttabbaemall.co.kr/category/hoyoverse/296/
    link_selector: 'p.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://ttabbaemall\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 90
    page_param: page  # Cafe24 ?page=N (페이지당 30건)
    max_pages: 3
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .detailArea
    detail_images_selector: '#prdDetail img'
    shop: 따빼몰

  # 국내 리셀러의 명조(워더링 웨이브) 공식 라이선스 굿즈.
  - name: 따빼몰 명조 굿즈
    type: html
    url: https://ttabbaemall.co.kr/category/명조워더링-웨이브/339/
    link_selector: 'p.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://ttabbaemall\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 90
    page_param: page  # Cafe24 ?page=N (페이지당 30건)
    max_pages: 3
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .detailArea
    detail_images_selector: '#prdDetail img'
    shop: 따빼몰

  # 따빼몰 전체 신규입고(cate_no=23). 작품 구분 없이 최신 입고순이라 첫 3페이지(90건)만 본다.
  # 뱃지·키링 등 굿즈가 중심이라 GOODS로 저장한다(FIGURE는 피규어 상품 카테고리에 자동 연결됨).
  # 위 작품별 소스와 겹치는 상품은 product_no URL이 같아 새 문서를 만들지 않는다.
  - name: 따빼몰 신규입고
    type: html
    url: https://ttabbaemall.co.kr/product/list.html?cate_no=23
    link_selector: 'p.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: GOODS
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://ttabbaemall\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 90
    page_param: page  # Cafe24 ?page=N (페이지당 30건)
    max_pages: 3
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .detailArea
    detail_images_selector: '#prdDetail img'
    shop: 따빼몰

  # 따빼몰 전체 신규예약(cate_no=24). 제목이 [예약]으로 시작하고 넨도로이드 등 피규어와 굿즈가 섞여 있다.
  - name: 따빼몰 신규예약
    type: html
    url: https://ttabbaemall.co.kr/product/list.html?cate_no=24
    link_selector: 'p.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: GOODS
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://ttabbaemall\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 90
    page_param: page  # Cafe24 ?page=N (페이지당 30건)
    max_pages: 3
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .detailArea
    detail_images_selector: '#prdDetail img'
    shop: 따빼몰

  # 마니아하우스(키덜트 전문샵, Cafe24) 예약 상품(cate_no=45). 피규어·프라모델이 섞여 있고 목록이 최신순이라 첫 2페이지(70건)만 본다.
  # 상세의 예약금·잔금 옵션 문구가 [입고완료] 상품을 예약으로 오인시키므로 기본 정보 블록(.xans-product-detaildesign)만 읽는다.
  - name: 마니아하우스 예약상품
    type: html
    url: https://maniahouse.co.kr/product/list.html?cate_no=45
    link_selector: 'a.name'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://maniahouse\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 70
    page_param: page  # Cafe24 ?page=N (페이지당 35건)
    max_pages: 2
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .xans-product-detaildesign
    detail_images_selector: '#prdDetail img'
    shop: 마니아하우스

  # 마니아하우스 입고 완료 상품(cate_no=46, 등록 1만 6천여 건). 최신순 첫 2페이지(70건)만 본다.
  # 위 예약 소스와 겹치는 상품은 product_no URL이 같아 새 문서를 만들지 않는다.
  - name: 마니아하우스 입고완료
    type: html
    url: https://maniahouse.co.kr/product/list.html?cate_no=46
    link_selector: 'a.name'
    region: KR
    category: FIGURE
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://maniahouse\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 70
    page_param: page  # Cafe24 ?page=N (페이지당 35건)
    max_pages: 2
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .xans-product-detaildesign
    detail_images_selector: '#prdDetail img'
    shop: 마니아하우스

  # 코믹스아트(Cafe24 피규어샵) 신작 상품(cate_no=1215). 신작 예약이 최신순으로 나온다(페이지당 56건).
  # 상세 페이지 본문에는 모든 상품에 "예약주문" 버튼 문구가 있어 상태가 오염되므로 목록 카드 텍스트만 쓴다. 상세는 새 상품당 1회 상세이미지만 받는다.
  # 카드에는 "예약" 단어 없이 발매·마감만 있어 그 라벨을 예약 신호로 넣는다. 마감은 연도가 없어 preorderEndAt은 비운다.
  - name: 코믹스아트 신작 상품
    type: html
    url: https://comics-art.co.kr/product/list.html?cate_no=1215
    link_selector: 'strong.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://comics-art\.co\.kr/product/detail\.html\?product_no=\d+'  # 목록 끝의 {$url} 템플릿 카드 제외
    max_items: 100
    page_param: page  # Cafe24 ?page=N (페이지당 56건)
    max_pages: 2
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    list_product_mode: true
    list_image_selector: '.prdImg img'
    detail_images_selector: '.xans-product-additional .continner img:not(.delivery img)'  # 상세 본문(배송 안내 이미지 제외)
    price_pattern: '판매가\s*:\s*([\d,]+)\s*원'  # 할인 카드에는 소비자가가 먼저 나온다
    preorder_words:
      - '발매 :'
      - '마감 :'
    shop: 코믹스아트

  # 코믹스아트 입고 완료 당일 발송(cate_no=49). 제목이 (당일발송)으로 시작하는 재고 상품이다.
  - name: 코믹스아트 입고 완료 당일 발송
    type: html
    url: https://comics-art.co.kr/product/list.html?cate_no=49
    link_selector: 'strong.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: FIGURE
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://comics-art\.co\.kr/product/detail\.html\?product_no=\d+'  # 목록 끝의 {$url} 템플릿 카드 제외
    max_items: 100
    page_param: page  # Cafe24 ?page=N (페이지당 56건)
    max_pages: 2
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    list_product_mode: true
    list_image_selector: '.prdImg img'
    detail_images_selector: '.xans-product-additional .continner img:not(.delivery img)'  # 상세 본문(배송 안내 이미지 제외)
    price_pattern: '판매가\s*:\s*([\d,]+)\s*원'  # 할인 카드에는 소비자가가 먼저 나온다
    shop: 코믹스아트

  # 헤로타임(Cafe24 피규어샵) 최신 예약 상품(cate_no=51, 페이지당 20건). 카드 구조는 코믹스아트와 같아 목록 카드 텍스트만 쓴다.
  # 카드에는 "예약" 단어 없이 마감·발매만 있어 그 라벨을 예약 신호로 넣는다. 마감은 연도가 없어 preorderEndAt은 비운다.
  # 상품명 앞의 숨김 라벨("상품명 :")이 있든 없든 제목이 같도록 title_strip_pattern으로 걷어 낸다.
  - name: 헤로타임 최신예약
    type: html
    url: https://herotime.co.kr/product/list.html?cate_no=51
    link_selector: 'strong.name a'
    title_strip_pattern: '^상품명\s*:\s*'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://herotime\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 40
    page_param: page  # Cafe24 ?page=N (페이지당 20건)
    max_pages: 2
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    list_product_mode: true
    list_image_selector: '.prdImg img'
    detail_images_selector: '.edibot-product-detail img'  # #prdDetail 없이 에디봇 상세 블록에 본문 이미지가 있다
    price_pattern: '판매가\s*:\s*([\d,]+)\s*원'
    preorder_words:
      - '발매 :'
      - '마감 :'
    shop: 헤로타임

  # 도키도키굿즈(Cafe24 애니 굿즈샵) 신상품(cate_no=28, 페이지당 20건, 최신순). robots.txt는 sort=/filter= 쿼리만 막으므로 정렬 파라미터는 쓰지 않는다.
  # 품절은 카드에 텍스트 없이 아이콘(alt="품절")으로만 나와 card_alt_text로 alt를 읽는다. 제목의 "[25년 12월 발매]" 꼬리표를 예약 신호로 본다(품절이 우선).
  - name: 도키도키굿즈 신상품
    type: html
    url: https://dokidokigoods.co.kr/product/list.html?cate_no=28
    link_selector: 'strong.name a'
    title_strip_pattern: '^상품명\s*:\s*'
    region: KR
    category: GOODS
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://dokidokigoods\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 40
    page_param: page  # Cafe24 ?page=N (페이지당 20건)
    max_pages: 2
    request_delay_min_seconds: 2.0
    request_delay_max_seconds: 4.5
    enabled: true
    respect_robots: true
    list_product_mode: true
    list_image_selector: img
    detail_images_selector: '#prdDetail img'
    image_deny_patterns:
      - '/web/upload/category/editor/'  # 상세 끝의 공통 안내 배너
    card_alt_text: true
    price_pattern: '판매가\s*:\s*([\d,]+)\s*원'
    preorder_words:
      - '월 발매]'
    shop: 도키도키굿즈

