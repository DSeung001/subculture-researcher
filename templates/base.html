<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}서브컬처 리서처{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="topnav">
    <a href="{{ url_for('index') }}" class="topnav-link {% if request.endpoint == 'index' %}active{% endif %}">인박스</a>
    <a href="{{ url_for('drafts_page') }}" class="topnav-link {% if request.endpoint == 'drafts_page' %}active{% endif %}">임시글</a>
    <a href="{{ url_for('sources_page') }}" class="topnav-link {% if request.endpoint == 'sources_page' %}active{% endif %}">수집 목록</a>
  </nav>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
