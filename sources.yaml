sources:
  # 국내 피규어 예약 상품. 공개 목록과 상세 페이지에서 가격/예약마감/입고예정 메타데이터를 수집한다.
  - name: 피규어팜 예약상품
    type: figurefarm
    url: https://m.figurefarm.net/shop/big_section.php?cno1=1554
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    max_items: 30
    figure_only: true
    enabled: true
    respect_robots: true

  # 애니메이션 작품 자체의 인기/트렌드 신호. 기사 DB 복제가 아니라 소재 발견용으로 소량만 수집한다.
  - name: AniList 트렌딩 애니
    type: anilist
    url: https://graphql.anilist.co
    region: GLOBAL
    category: ANIME
    content_angle: NEWS
    source_tier: MEDIA
    max_items: 30
    cache_hours: 24
    enabled: true

  # 일본 기업 보도자료의 만화/애니 카테고리.
  - name: PR TIMES 만화·애니
    type: html
    url: https://prtimes.jp/main/html/searchbiscate/busi_cate_id/007/lv2/20
    link_selector: 'a[href*="/main/html/rd/p/"]'
    region: JP
    category: ANIME
    content_angle: NEWS
    source_tier: OFFICIAL
    allow_patterns:
      - '^https://prtimes\.jp/main/html/rd/p/[0-9]+\.[0-9]+\.html$'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true

  # 일본 애니 공식 YouTube 채널. channel_id로 공식 Atom feed만 읽는다.
  - name: KADOKAWA Anime YouTube
    type: youtube_feed
    url: https://www.youtube.com/@KADOKAWAanime
    channel_url: https://www.youtube.com/@KADOKAWAanime
    channel_id: UCY5fcqgSrQItPAX_Z5Frmwg
    region: JP
    category: ANIME
    content_angle: NEWS
    source_tier: OFFICIAL
    max_items: 15
    enabled: true

  - name: Aniplex YouTube
    type: youtube_feed
    url: https://www.youtube.com/@aniplex
    channel_url: https://www.youtube.com/@aniplex
    channel_id: UC14QT5j2nQI8lKBCGtrrBQA
    region: JP
    category: ANIME
    content_angle: NEWS
    source_tier: OFFICIAL
    max_items: 15
    enabled: true

  - name: TOHO animation YouTube
    type: youtube_feed
    url: https://www.youtube.com/@TOHOanimation
    channel_url: https://www.youtube.com/@TOHOanimation
    channel_id: UC14Yc2Qv92DMuyNRlHvpo2Q
    region: JP
    category: ANIME
    content_angle: NEWS
    source_tier: OFFICIAL
    max_items: 15
    enabled: true

  # 일본 피규어/하비 뉴스. 카테고리 페이지에서 기사 링크만 수집한다.
  - name: HOBBY Watch 피규어
    type: html
    url: https://hobby.watch.impress.co.jp/category/figure/
    region: JP
    category: FIGURE
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://hobby\.watch\.impress\.co\.jp/docs/news/'
      - '^https://hobby\.watch\.impress\.co\.jp/docs/review/'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true

  # 제조사 공식 뉴스. 신제품/예약/출시 공지를 원천 데이터로 사용한다.
  - name: Good Smile Company 뉴스
    type: html
    url: https://www.goodsmile.com/en/news
    region: JP
    category: FIGURE
    content_angle: NEWS
    source_tier: OFFICIAL
    allow_patterns:
      - '^https://www\.goodsmile\.com/en/news/'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true

  # 일본 굿즈/피규어 미디어 허브. 본문 카드(.c-item)만 모아 사이드 랭킹을 제외한다.
  - name: Animate Times 굿즈
    type: html
    url: https://www.animatetimes.com/goods/
    link_selector: '.c-item a[href*="/news/details.php"]'
    region: JP
    category: GOODS
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://www\.animatetimes\.com/news/details\.php\?id=\d+'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true

  # 국내 애니/굿즈 뉴스. 애니메이션 유입용 콘텐츠 후보를 수집한다.
  - name: 애니플러스 뉴스
    type: html
    url: https://news.aniplustv.com/news
    render_js: true
    render_timeout_seconds: 30
    link_selector: '.grid a[href^="/news/"]:has(h3):has(p)'
    wait_selector: '.grid a[href^="/news/"]:has(h3):has(p)'
    title_selector: h3
    published_selector: p
    published_format: '%Y/%m/%d'
    next_page_selector: 'button[aria-label="다음 페이지"]'
    max_pages: 2
    detail_wait_selector: 'div:has(> div > button[aria-label="좋아요"]) > span'
    detail_metrics:
      likeCount: 'div:has(> div > button[aria-label="좋아요"]) > span'
    # 공개 화면에 조회수가 없어 viewCount 선택자는 지정하지 않는다.
    region: KR
    category: ANIME
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://news\.aniplustv\.com/news/[0-9]+$'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true

  # 로그인/JS 이동이 필요한 국내 페어·이벤트. 로컬 Playwright 프로필로만 수집한다.
  - name: 애니메이트 코리아 페어·이벤트
    type: local_browser
    url: https://www.animate-onlineshop.co.kr/board/list.php?bdId=event
    region: KR
    category: FESTIVAL
    content_angle: NEWS
    source_tier: MEDIA
    local_only: true
    interactive_ready: true
    browser_profile: animate-korea
    link_selector: 'a, [onclick], [data-href], [data-url]'
    allow_patterns:
      - '^https://www\.animate-onlineshop\.co\.kr/board/'
    max_items: 30
    scroll_steps: 2
    scroll_delay_seconds: 2
    item_delay_seconds: 0.5
    enabled: true

  # AGF(Anime Game Festival) Korea 공식 공지사항 = 국내 대표 서브컬처 페스티벌 소식.
  # 목록이 React 클라이언트 라우팅이라 HTML 링크 추출이 불가능해
  # 페이지가 실제로 호출하는 공개 JSON API(getBoardList)를 직접 불러온다. robots.txt 없음, CORS 공개.
  - name: AGF Korea 공지사항
    type: json_api
    url: https://api.agfkorea.com:3070/front/api/getBoardList?board_id=1&lang=KOR&gotoPage=1
    items_path: listData
    id_field: idx
    title_field: title
    date_field: writeday
    date_format: '%Y-%m-%d %H:%M:%S.%f'
    detail_url_template: 'https://www.agfkorea.com/post/1/{id}'
    region: KR
    category: FESTIVAL
    content_angle: NEWS
    source_tier: OFFICIAL
    max_items: 40
    enabled: true

  # 아래 소스는 GitHub Actions에서 실행하지 않는다.
  # 로컬에서 --local-browser 옵션을 줄 때만 headed Playwright + 소스별 영속 프로필로 수집한다.
  # 로그인/MFA/Cloudflare 인증은 사용자가 열린 브라우저에서 직접 완료한 뒤 Enter를 누른다.

  - name: 라프텔 인기·신작
    type: local_browser
    url: https://laftel.net/
    region: KR
    category: ANIME
    content_angle: NEWS
    source_tier: MEDIA
    local_only: true
    interactive_ready: true
    browser_profile: laftel
    interactive_message: '라프텔 로그인 후 인기 애니/이번주/분기/요일별 신작 등 원하는 목록 화면으로 이동하고 Enter를 누르세요.'
    link_selector: 'a[href]'
    allow_patterns:
      - '^https://laftel\.net/'
    deny_patterns:
      - '/login'
      - '/setting'
      - '/profile'
      - '/payment'
    max_items: 30
    scroll_steps: 4
    scroll_delay_seconds: 3
    item_delay_seconds: 0.8
    enabled: true

  - name: 라프텔 스토어
    type: local_browser
    url: https://laftel.net/
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    local_only: true
    interactive_ready: true
    browser_profile: laftel
    interactive_message: '라프텔 로그인 후 스토어의 피규어/예약상품 목록 화면으로 이동하고 Enter를 누르세요.'
    link_selector: 'a[href], [data-href], [data-url], [onclick]'
    allow_patterns:
      - '^https://laftel\.net/'
    required_text_patterns:
      - '피규어'
      - '넨도로이드'
      - '예약'
      - '원'
    product_mode: true
    shop: Laftel
    max_items: 30
    scroll_steps: 6
    scroll_delay_seconds: 3
    item_delay_seconds: 1
    enabled: true

  - name: animate 서울홍대점
    type: local_browser
    url: https://x.com/animate_hongdae
    region: KR
    category: GOODS
    content_angle: NEWS
    source_tier: OFFICIAL
    local_only: true
    interactive_ready: true
    browser_profile: x-animate-hongdae
    interactive_message: 'X 로그인/인증을 직접 완료하고 animate 서울홍대점 타임라인이 보이면 Enter를 누르세요.'
    link_selector: 'a[href*="/status/"]'
    allow_patterns:
      - '^https://x\.com/animate_hongdae/status/'
    max_items: 25
    scroll_steps: 6
    scroll_delay_seconds: 3
    item_delay_seconds: 0.8
    enabled: true

  - name: 일러스타 페스
    type: local_browser
    url: https://illustar.imweb.me/
    region: KR
    category: FESTIVAL
    content_angle: NEWS
    source_tier: OFFICIAL
    local_only: true
    interactive_ready: true
    browser_profile: illustar
    interactive_message: '공지사항/티켓/행사 정보 중 수집할 화면으로 이동한 뒤 Enter를 누르세요.'
    link_selector: 'a[href], [data-href], [onclick]'
    allow_patterns:
      - '^https://illustar\.imweb\.me/'
      - '^https://illustar\.net/'
    max_items: 30
    scroll_steps: 3
    scroll_delay_seconds: 2
    item_delay_seconds: 0.5
    enabled: true

  - name: 코믹월드
    type: local_browser
    url: https://comicw.co.kr/
    region: KR
    category: FESTIVAL
    content_angle: NEWS
    source_tier: OFFICIAL
    local_only: true
    interactive_ready: true
    browser_profile: comicworld
    interactive_message: '코믹월드 공지/행사/티켓 화면으로 이동한 뒤 Enter를 누르세요.'
    link_selector: 'a[href], [data-href], [onclick]'
    allow_patterns:
      - '^https://comicw\.co\.kr/'
    max_items: 30
    scroll_steps: 3
    scroll_delay_seconds: 2
    item_delay_seconds: 0.5
    enabled: true

  - name: Kotobukiya 뉴스
    type: local_browser
    url: https://www.kotobukiya.co.jp/en/news/
    region: JP
    category: FIGURE
    content_angle: NEWS
    source_tier: OFFICIAL
    local_only: true
    interactive_ready: true
    browser_profile: kotobukiya
    interactive_message: 'Cloudflare 확인이 나오면 직접 완료하고 뉴스/상품 목록이 보이면 Enter를 누르세요.'
    link_selector: 'a[href]'
    allow_patterns:
      - '^https://www\.kotobukiya\.co\.jp/'
    max_items: 30
    scroll_steps: 3
    scroll_delay_seconds: 3
    item_delay_seconds: 0.7
    enabled: true

  # 국내 리셀러의 호요버스(원신/스타레일/젠레스존제로) 공식 라이선스 굿즈. 예약마감/가격이 목록에 노출된다.
  - name: 따빼몰 호요버스 굿즈
    type: html
    url: https://ttabbaemall.co.kr/category/hoyoverse/296/
    link_selector: 'p.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://ttabbaemall\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .detailArea
    shop: 따빼몰

  # 국내 리셀러의 명조(워더링 웨이브) 공식 라이선스 굿즈.
  - name: 따빼몰 명조 굿즈
    type: html
    url: https://ttabbaemall.co.kr/category/명조워더링-웨이브/339/
    link_selector: 'p.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://ttabbaemall\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .detailArea
    shop: 따빼몰

  # 국내 정품 피규어샵의 예약상품 목록. 장르 제한 없이 미국/일본/중국 라이선스 피규어가 섞여 있다.
  - name: 피규어프레소 예약상품
    type: html
    url: https://m.figurepresso.com/product/preorder.html?cate_no=24
    link_selector: 'li.item a[href^="/product/"]'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://m\.figurepresso\.com/product/.+/\d+/'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true
    shop: 피규어프레소

  # 미국 공식 피규어 브랜드 뉴스. Sideshow는 Queue-it 대기실(사실상 항상 리다이렉트)로
  # 막혀 있어 자동 수집이 불가능해 McFarlane Toys 공식 뉴스로 대체했다.
  - name: McFarlane Toys 뉴스
    type: html
    url: https://www.mcfarlane.com/news
    region: US
    category: FIGURE
    content_angle: NEWS
    source_tier: OFFICIAL
    allow_patterns:
      - '^https://www\.mcfarlane\.com/post/'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true

  # 다른 대형 페스티벌은 확인 결과 자동 수집기로 붙이기 어려웠다:
  # - Wonder Festival(wonfes.jp) 공지: robots.txt는 허용하지만 모든 공지가 /info/ 한 페이지 안의
  #   #info{id} 앵커로만 구분돼, URL 기준 중복 제거(SHA-256) 모델과 맞지 않는다.
  # - Comiket(comiket.co.jp): 정기 뉴스 목록 페이지가 없고 행사(C108/C109 등)마다 정적 페이지가
  #   개별 URL로 흩어져 있어 안정적인 link_selector를 잡기 어렵다.
  # - Anime Festival Asia(animefestival.asia): WordPress이지만 news-sitemap이 사실상 비어 있어
  #   (전용 뉴스/블로그 피드가 없음) 정기 수집 대상이 되지 못한다.
  # 특정 페스티벌 공식 사이트 URL을 알려주면 구조를 확인해 소스로 추가한다.

