sources:
  # 국내 피규어 예약 상품. 공개 목록과 상세 페이지에서 가격/예약마감/입고예정 메타데이터를 수집한다.
  - name: 피규어팜 예약상품
    type: figurefarm
    url: https://m.figurefarm.net/shop/big_section.php?cno1=1554
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    max_items: 30
    figure_only: true
    enabled: true
    respect_robots: true

  # 애니메이션 작품 자체의 인기/트렌드 신호. 기사 DB 복제가 아니라 소재 발견용으로 소량만 수집한다.
  - name: AniList 트렌딩 애니
    type: anilist
    url: https://graphql.anilist.co
    region: GLOBAL
    category: ANIME
    content_angle: NEWS
    source_tier: MEDIA
    max_items: 30
    cache_hours: 24
    enabled: true

  # 일본 기업 보도자료의 만화/애니 카테고리.
  - name: PR TIMES 만화·애니
    type: html
    url: https://prtimes.jp/main/html/searchbiscate/busi_cate_id/007/lv2/20
    link_selector: 'a[href*="/main/html/rd/p/"]'
    region: JP
    category: ANIME
    content_angle: NEWS
    source_tier: OFFICIAL
    allow_patterns:
      - '^https://prtimes\.jp/main/html/rd/p/[0-9]+\.[0-9]+\.html$'
    max_items: 40
    enabled: true
    respect_robots: true
    fetch_detail_image: true  # 목록에는 이미지가 없어 상세 og:image(보도자료 대표 이미지)를 쓴다

  # 일본 애니 공식 YouTube 채널. channel_id로 공식 Atom feed만 읽는다.
  # RSS가 간헐 404를 내므로 자동 스케줄에서 제외하고 collect_manual.py로만 실행한다.
  - name: KADOKAWA Anime YouTube
    type: youtube_feed
    url: https://www.youtube.com/@KADOKAWAanime
    channel_url: https://www.youtube.com/@KADOKAWAanime
    channel_id: UCY5fcqgSrQItPAX_Z5Frmwg
    region: JP
    category: ANIME
    content_angle: NEWS
    source_tier: OFFICIAL
    max_items: 15
    manual_only: true
    enabled: true

  - name: Aniplex YouTube
    type: youtube_feed
    url: https://www.youtube.com/@aniplex
    channel_url: https://www.youtube.com/@aniplex
    channel_id: UC14QT5j2nQI8lKBCGtrrBQA
    region: JP
    category: ANIME
    content_angle: NEWS
    source_tier: OFFICIAL
    max_items: 15
    manual_only: true
    enabled: true

  - name: TOHO animation YouTube
    type: youtube_feed
    url: https://www.youtube.com/@TOHOanimation
    channel_url: https://www.youtube.com/@TOHOanimation
    channel_id: UC14Yc2Qv92DMuyNRlHvpo2Q
    region: JP
    category: ANIME
    content_angle: NEWS
    source_tier: OFFICIAL
    max_items: 15
    manual_only: true
    enabled: true

  # 일본 피규어/하비 뉴스. 카테고리 페이지에서 기사 링크만 수집한다.
  - name: HOBBY Watch 피규어
    type: html
    url: https://hobby.watch.impress.co.jp/category/figure/
    region: JP
    category: FIGURE
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://hobby\.watch\.impress\.co\.jp/docs/news/'
      - '^https://hobby\.watch\.impress\.co\.jp/docs/review/'
    max_items: 40
    enabled: true
    respect_robots: true
    list_image_selector: img  # li.item 안의 기사별 list.jpg

  # 일본 굿즈/피규어 미디어 허브. 본문 카드(.c-item)만 모아 사이드 랭킹을 제외한다.
  - name: Animate Times 굿즈
    type: html
    url: https://www.animatetimes.com/goods/
    link_selector: '.c-item a[href*="/news/details.php"]'
    region: JP
    category: GOODS
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://www\.animatetimes\.com/news/details\.php\?id=\d+'
    max_items: 40
    enabled: true
    respect_robots: true
    list_image_selector: img  # .c-item 카드의 기사별 이미지

  # 국내 애니/굿즈 뉴스. 애니메이션 유입용 콘텐츠 후보를 수집한다.
  - name: 애니플러스 뉴스
    type: html
    url: https://news.aniplustv.com/news
    render_js: true
    render_timeout_seconds: 30
    link_selector: '.grid a[href^="/news/"]:has(h3):has(p)'
    wait_selector: '.grid a[href^="/news/"]:has(h3):has(p)'
    title_selector: h3
    published_selector: p
    published_format: '%Y/%m/%d'
    next_page_selector: 'button[aria-label="다음 페이지"]'
    max_pages: 2
    detail_wait_selector: 'div:has(> div > button[aria-label="좋아요"]) > span'
    detail_metrics:
      likeCount: 'div:has(> div > button[aria-label="좋아요"]) > span'
    # 공개 화면에 조회수가 없어 viewCount 선택자는 지정하지 않는다.
    region: KR
    category: ANIME
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://news\.aniplustv\.com/news/[0-9]+$'
    max_items: 40
    enabled: true
    respect_robots: true
    list_image_selector: img  # 카드(a) 안의 기사별 이미지

  # AGF(Anime Game Festival) Korea 공식 공지사항 = 국내 대표 서브컬처 페스티벌 소식.
  # 목록이 React 클라이언트 라우팅이라 HTML 링크 추출이 불가능해
  # 페이지가 실제로 호출하는 공개 JSON API(getBoardList)를 직접 불러온다. robots.txt 없음, CORS 공개.
  - name: AGF Korea 공지사항
    type: json_api
    url: https://api.agfkorea.com:3070/front/api/getBoardList?board_id=1&lang=KOR&gotoPage=1
    items_path: listData
    id_field: idx
    title_field: title
    date_field: writeday
    date_format: '%Y-%m-%d %H:%M:%S.%f'
    detail_url_template: 'https://www.agfkorea.com/post/1/{id}'
    image_html_field: content  # 공지 본문 HTML의 첫 <img>(안내 이미지)
    region: KR
    category: FESTIVAL
    content_angle: NEWS
    source_tier: OFFICIAL
    max_items: 40
    enabled: true

  # 수동 전용(YouTube RSS 등)은 위 manual_only 소스. 라프텔은 store.laftel.net 공개 HTML만
  # 자동 수집한다(아래 「라프텔 스토어」). laftel.net 인기·신작 브라우저 수집은 쓰지 않는다.

  # 국내 리셀러의 호요버스(원신/스타레일/젠레스존제로) 공식 라이선스 굿즈. 예약마감/가격이 목록에 노출된다.
  - name: 따빼몰 호요버스 굿즈
    type: html
    url: https://ttabbaemall.co.kr/category/hoyoverse/296/
    link_selector: 'p.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://ttabbaemall\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .detailArea
    shop: 따빼몰

  # 국내 리셀러의 명조(워더링 웨이브) 공식 라이선스 굿즈.
  - name: 따빼몰 명조 굿즈
    type: html
    url: https://ttabbaemall.co.kr/category/명조워더링-웨이브/339/
    link_selector: 'p.name a'
    title_selector: ':scope > span:not(.title)'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://ttabbaemall\.co\.kr/product/detail\.html\?product_no=\d+'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true
    product_text_selector: .detailArea
    shop: 따빼몰

  # 국내 정품 피규어샵의 예약상품 목록. 장르 제한 없이 미국/일본/중국 라이선스 피규어가 섞여 있다.
  - name: 피규어프레소 예약상품
    type: html
    url: https://m.figurepresso.com/product/preorder.html?cate_no=24
    link_selector: 'li.item a[href^="/product/"]'
    region: KR
    category: FIGURE
    content_angle: PRICE
    source_tier: MEDIA
    allow_patterns:
      - '^https://m\.figurepresso\.com/product/.+/\d+/'
    max_items: 40
    enabled: true
    respect_robots: true
    product_mode: true
    shop: 피규어프레소

  # 라프텔 스토어 신상품(NEW 배지). 로그인 없이 공개 HTML이며 robots.txt가 허용한다.
  # 목록 카드 텍스트에서 가격·예약 상태를 읽어 상세 요청은 하지 않는다(예약마감일은 상세에만 있어 수집하지 않음).
  - name: 라프텔 스토어
    type: html
    url: https://store.laftel.net/
    link_selector: 'a[href^="/products/"]:-soup-contains("NEW")'
    title_strip_pattern: '\s[\d,]+원.*$'
    region: KR
    category: FIGURE
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://store\.laftel\.net/products/\d+/?$'
    max_items: 30
    enabled: true
    respect_robots: true
    list_product_mode: true
    list_image_selector: img
    shop: Laftel

  # 애니메이트 코리아 온라인샵 신상품(cateCd=008). 피규어 전용 카테고리는 없고 굿즈 중심이며 서적은 제외한다.
  - name: 애니메이트 코리아 신상품
    type: html
    url: https://www.animate-onlineshop.co.kr/goods/goods_list.php?cateCd=008
    link_selector: '.item_tit_box a[href*="goods_view.php?goodsNo="]'
    title_selector: .item_name
    title_deny_patterns:
      - '^【(국내|일본)서적'
    region: KR
    category: GOODS
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - 'goods_view\.php\?goodsNo=\d+'
    max_items: 30
    enabled: true
    respect_robots: true
    list_product_mode: true
    list_image_selector: '.item_photo_box img'
    shop: 애니메이트 코리아

  # 미국 공식 피규어 브랜드 뉴스. Sideshow는 Queue-it 대기실(사실상 항상 리다이렉트)로
  # 막혀 있어 자동 수집이 불가능해 McFarlane Toys 공식 뉴스로 대체했다.
  - name: McFarlane Toys 뉴스
    type: html
    url: https://www.mcfarlane.com/news
    region: US
    category: FIGURE
    content_angle: NEWS
    source_tier: OFFICIAL
    allow_patterns:
      - '^https://www\.mcfarlane\.com/post/'
    max_items: 40
    enabled: true
    respect_robots: true
    fetch_detail_image: true  # 목록 이미지는 blur_30 저화질 미리보기라 상세 og:image(w_1000)를 쓴다
    image_deny_patterns:
      - 'blur_\d+'

  # 다른 대형 페스티벌은 확인 결과 자동 수집기로 붙이기 어려웠다:
  # - Wonder Festival(wonfes.jp) 공지: robots.txt는 허용하지만 모든 공지가 /info/ 한 페이지 안의
  #   #info{id} 앵커로만 구분돼, URL 기준 중복 제거(SHA-256) 모델과 맞지 않는다.
  # - Comiket(comiket.co.jp): 정기 뉴스 목록 페이지가 없고 행사(C108/C109 등)마다 정적 페이지가
  #   개별 URL로 흩어져 있어 안정적인 link_selector를 잡기 어렵다.
  # - Anime Festival Asia(animefestival.asia): WordPress이지만 news-sitemap이 사실상 비어 있어
  #   (전용 뉴스/블로그 피드가 없음) 정기 수집 대상이 되지 못한다.
  # 특정 페스티벌 공식 사이트 URL을 알려주면 구조를 확인해 소스로 추가한다.

