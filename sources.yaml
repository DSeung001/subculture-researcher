sources:
  # 일본 피규어/하비 뉴스. 카테고리 페이지에서 기사 링크만 수집한다.
  - name: HOBBY Watch 피규어
    type: html
    url: https://hobby.watch.impress.co.jp/category/figure/
    region: JP
    category: FIGURE
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://hobby\.watch\.impress\.co\.jp/docs/news/'
      - '^https://hobby\.watch\.impress\.co\.jp/docs/review/'
    max_items: 40
    enabled: true
    respect_robots: true

  # 제조사 공식 뉴스. 신제품/예약/출시 공지를 원천 데이터로 사용한다.
  - name: Good Smile Company 뉴스
    type: html
    url: https://www.goodsmile.com/en/news
    region: JP
    category: FIGURE
    content_angle: NEWS
    source_tier: OFFICIAL
    allow_patterns:
      - '^https://www\.goodsmile\.com/en/news/'
    max_items: 40
    enabled: true
    respect_robots: true

  # 제조사 공식 뉴스. Cloudflare가 단순 HTTP를 막아 당분간 비활성. 패턴은 준비해 둔다.
  - name: Kotobukiya 뉴스
    type: html
    url: https://www.kotobukiya.co.jp/en/news/
    region: JP
    category: FIGURE
    content_angle: NEWS
    source_tier: OFFICIAL
    allow_patterns:
      - '^https://www\.kotobukiya\.co\.jp/en/news/detail/\d+/'
      - '^https://www\.kotobukiya\.co\.jp/news/detail/\d+/'
    max_items: 40
    enabled: false
    respect_robots: true

  # 일본 굿즈/피규어 미디어 허브. 본문 카드(.c-item)만 모아 사이드 랭킹을 제외한다.
  - name: Animate Times 굿즈
    type: html
    url: https://www.animatetimes.com/goods/
    link_selector: '.c-item a[href*="/news/details.php"]'
    region: JP
    category: GOODS
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://www\.animatetimes\.com/news/details\.php\?id=\d+'
    max_items: 40
    enabled: true
    respect_robots: true

  # 국내 애니/굿즈 뉴스. 애니메이션 유입용 콘텐츠 후보를 수집한다.
  - name: 애니플러스 뉴스
    type: html
    url: https://news.aniplustv.com/news
    render_js: true
    render_timeout_seconds: 30
    link_selector: '.grid a[href^="/news/"]:has(h3):has(p)'
    wait_selector: '.grid a[href^="/news/"]:has(h3):has(p)'
    title_selector: h3
    published_selector: p
    published_format: '%Y/%m/%d'
    next_page_selector: 'button[aria-label="다음 페이지"]'
    max_pages: 2
    detail_wait_selector: 'div:has(> div > button[aria-label="좋아요"]) > span'
    detail_metrics:
      likeCount: 'div:has(> div > button[aria-label="좋아요"]) > span'
    # 공개 화면에 조회수가 없어 viewCount 선택자는 지정하지 않는다.
    region: KR
    category: ANIME
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://news\.aniplustv\.com/news/[0-9]+$'
    max_items: 40
    enabled: true
    respect_robots: true

  # 국내 공식 페어/이벤트. 목록이 JS 네비게이션이라 현재 HTML 수집기로는 링크를 못 뽑는다.
  - name: 애니메이트 코리아 페어·이벤트
    type: html
    url: https://www.animate-onlineshop.co.kr/board/list.php?bdId=event
    region: KR
    category: GOODS
    content_angle: NEWS
    source_tier: MEDIA
    allow_patterns:
      - '^https://www\.animate-onlineshop\.co\.kr/board/view\.php\?bdId=event'
    max_items: 40
    enabled: false
    respect_robots: true

  # 국내 피규어 커뮤니티 VOC. 질문/후기/장식장 고민을 찾기 위한 소스였으나
  # 사용자 커뮤니티 배제 정책으로 비활성화. 신규 상품/애니/피규어 정보만 남긴다.
  - name: DC 피규어 마이너 갤러리
    type: html
    url: https://gall.dcinside.com/mgallery/board/lists/?id=figuregall
    region: KR
    category: COLLECTION
    content_angle: QUESTION
    source_tier: COMMUNITY
    allow_patterns:
      - '^https://gall\.dcinside\.com/mgallery/board/view/\?id=figuregall'
    max_items: 50
    enabled: false
    respect_robots: true

  # 국내 피규어 정보/리뷰 커뮤니티였으나 사용자 커뮤니티 배제 정책으로 비활성화.
  - name: 루리웹 피규어 정보
    type: html
    url: https://bbs.ruliweb.com/family/242/board/300017
    region: KR
    category: FIGURE
    content_angle: NEWS
    source_tier: COMMUNITY
    allow_patterns:
      - '^https://bbs\.ruliweb\.com/family/242/board/300017/read/'
    max_items: 50
    enabled: false
    respect_robots: true

  # 국내 피규어 커뮤니티 VOC. 입양/개봉/소장 글을 수집하던 소스였으나
  # 사용자 커뮤니티 배제 정책으로 비활성화.
  - name: 덕벤 프라모델/피규어
    type: html
    url: https://www.inven.co.kr/board/party/3714?category=피규어
    region: KR
    category: FIGURE
    content_angle: COLLECTION
    source_tier: COMMUNITY
    allow_patterns:
      - '^https://www\.inven\.co\.kr/board/party/3714/\d+'
    max_items: 50
    enabled: false
    respect_robots: true

  # 아래 채널은 X 중심이라 웹 자동 스크래핑하지 않는다.
  # 라프텔, animate 서울홍대점, AGF Korea, 일러스타 페스, 코믹월드
  # 발견한 게시물은 Streamlit의 "수동 콘텐츠 추가"로 저장한다.
